name = "kicad-review-site"
main = "worker.js"
compatibility_date = "2026-10-07"
# threadsClient is sent via .toString(); name helpers would not exist in the browser.
keep_names = false

[[rules]]
type = "Text"
globs = ["**/*.css", "**/ui/*.js", "**/ui/review.html", "**/ui/icons/sprite.svg"]

# Set GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET, and SESSION_KEY with
# npx wrangler secret put NAME; never commit those secrets.
[vars]
ALLOWED_OWNERS = "Cameronrlewis"

# Shares one-use GitHub refresh token rotations across isolates; keeps nothing in storage.
[[durable_objects.bindings]]
name = "REFRESH"
class_name = "RefreshCoordinator"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RefreshCoordinator"]
