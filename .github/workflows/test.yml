name: Self-test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # Software-GL runners draw the multi-layer pixel checks far slower than a laptop GPU.
      CHECK_TIMEOUT: 60000
      CHECK_WALL_TIMEOUT: 120000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 test_kicad_review.py
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node --import ./site/css-loader.mjs --test site/test.mjs
      - name: Build browser fixtures
        run: |
          echo "CHROME=google-chrome" >> "$GITHUB_ENV"
          export PAGES=$(mktemp -d)
          echo "PAGES=$PAGES" >> "$GITHUB_ENV"
          python3 -c 'import os, pathlib, kicad_review as k; [pathlib.Path(os.environ["PAGES"], name + ".html").write_text(k.inline_page(pathlib.Path("ui/sample/" + data).read_text(encoding="utf-8")), encoding="utf-8") for name, data in [("3d", "review-data-3d.js"), ("two", "review-data-2.js"), ("parts", "review-data-parts.js")]]'
          python3 -c 'import json, os, pathlib, kicad_review as k
          fx = json.loads(pathlib.Path("ui/fixtures/bom-multiboard.json").read_text(encoding="utf-8"))
          boards, projects = [], []
          for b in fx["boards"]:
              lines = k.parts_lines(b["objects"])
              boards.append({"name": b["name"], "lines": lines, "objects": b["objects"]})
              projects.append({"name": b["name"], "dir": "", "status": "modified", "sheets": [], "changes": [], "checks": [], "board": {"changed": False, "layers": []},
                               "parts": {"supplier": None, "summary": k.bom_summary(lines), "exports": k.bom_exports(lines, "jlcpcb", None, b["objects"]), "lines": lines, "changes": []}})
          data = {"version": 1, "repo": "example/multi", "base": "base", "head": "head", "reason": "Multi-board fixture", "links": {}, "blobs": {}, "projects": projects, "bom": k.bom_repository(boards, "jlcpcb")}
          payload = json.dumps(data, ensure_ascii=False, separators=(",", ":")).replace("<", "\\u003c")
          pathlib.Path(os.environ["PAGES"], "multiboard.html").write_text(k.inline_page(f"window.REVIEW_DATA = {payload};"), encoding="utf-8")'
      - run: node ui/check.mjs
      - run: node ui/check.mjs --dark
      - run: node ui/check.mjs --no-skip "Waivers"
      - run: node ui/check.mjs --no-skip "selection-only address"
      - run: node ui/check.mjs --no-skip "pasted selection address preserves an explicit position"
      - run: node ui/check.mjs --no-skip "passing checks with baseline findings"
      - run: node ui/check.mjs --no-skip 3D --page "$PAGES/3d.html"
      - run: node ui/check.mjs --no-skip 3D --dark --page "$PAGES/3d.html"
      - run: node ui/check.mjs --no-skip "unchanged sheet" --page "$PAGES/two.html"
      - run: node ui/check.mjs --no-skip "unchanged project" --page "$PAGES/two.html"
      - run: node ui/check.mjs --no-skip "bench-t2 single offline chrome" --page "$PAGES/two.html"
      - run: node ui/check.mjs --no-skip "Parts fixture" --page "$PAGES/parts.html"
      - run: node ui/check.mjs --no-skip "Parts fixture" --dark --page "$PAGES/parts.html"
      - run: node ui/check.mjs --no-skip "Multi-board BOM" --page "$PAGES/multiboard.html"
