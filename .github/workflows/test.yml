name: Self-test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 test_kicad_review.py
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node --import ./site/css-loader.mjs --test site/test.mjs
      - name: Build browser fixtures
        run: |
          echo "CHROME=$(command -v google-chrome || printf /usr/bin/google-chrome)" >> "$GITHUB_ENV"
          echo "PAGES=$(mktemp -d)" >> "$GITHUB_ENV"
      - run: |
          python3 -c 'import os, pathlib, kicad_review as k; [pathlib.Path(os.environ["PAGES"], name + ".html").write_text(k.inline_page(pathlib.Path("ui/sample/" + data).read_text(encoding="utf-8")), encoding="utf-8") for name, data in [("3d", "review-data-3d.js"), ("two", "review-data-2.js")]]'
      - run: node ui/check.mjs
      - run: node ui/check.mjs --dark
      - run: node ui/check.mjs --no-skip 3D --page "$PAGES/3d.html"
      - run: node ui/check.mjs --no-skip 3D --dark --page "$PAGES/3d.html"
      - run: node ui/check.mjs --no-skip "unchanged sheet" --page "$PAGES/two.html"
      - run: node ui/check.mjs --no-skip "unchanged project" --page "$PAGES/two.html"
