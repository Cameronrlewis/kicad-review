name: Self-test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  # The light and dark full suites each take ~15-30 min on software GL; running both in one job overran its timeout.
  dark:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CHECK_TIMEOUT: 60000
      CHECK_WALL_TIMEOUT: 120000
      CHROME: google-chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node ui/check.mjs --dark
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # Software-GL runners draw the multi-layer pixel checks far slower than a laptop GPU.
      CHECK_TIMEOUT: 60000
      CHECK_WALL_TIMEOUT: 120000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 test_kicad_review.py
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node --import ./site/css-loader.mjs --test site/test.mjs
      - run: node --test ui/image-view.test.mjs
      - name: Build browser fixtures
        run: |
          echo "CHROME=google-chrome" >> "$GITHUB_ENV"
          export PAGES=$(mktemp -d)
          echo "PAGES=$PAGES" >> "$GITHUB_ENV"
          python3 -c 'import os, pathlib, kicad_review as k; [pathlib.Path(os.environ["PAGES"], name + ".html").write_text(k.inline_page(pathlib.Path("ui/sample/" + data).read_text(encoding="utf-8")), encoding="utf-8") for name, data in [("3d", "review-data-3d.js"), ("two", "review-data-2.js"), ("parts", "review-data-parts.js"), ("images", "review-data-images.js")]]'
      - run: node ui/check.mjs
      - run: node ui/check.mjs --no-skip "Waivers"
      - run: node ui/check.mjs --no-skip "images fallback selected export palettes" --page "$PAGES/two.html"
      - run: node ui/check.mjs --no-skip "selection-only address"
      - run: node ui/check.mjs --no-skip "pasted selection address preserves an explicit position"
      - run: node ui/check.mjs --no-skip "passing checks with baseline findings"
      - run: node ui/check.mjs --no-skip 3D --page "$PAGES/3d.html"
      - run: node ui/check.mjs --no-skip 3D --dark --page "$PAGES/3d.html"
      - run: node ui/check.mjs --no-skip "unchanged sheet" --page "$PAGES/two.html"
      - run: node ui/check.mjs --no-skip "unchanged project" --page "$PAGES/two.html"
      - run: node ui/check.mjs --no-skip "bench-t2 single offline chrome" --page "$PAGES/two.html"
      - run: node ui/check.mjs --no-skip "Parts fixture" --page "$PAGES/parts.html"
      - run: node ui/check.mjs --no-skip "Parts fixture" --dark --page "$PAGES/parts.html"
      - run: node ui/check.mjs --no-skip "images screen and legacy appearance"
      - run: node ui/check.mjs --no-skip "images compare and four copper layers" --page "$PAGES/images.html"
      - run: node ui/check.mjs --no-skip "images gesture lifecycle" --page "$PAGES/images.html"
      - run: node ui/check.mjs --no-skip "images fallback appearance" --page "$PAGES/images.html"
      - run: node ui/check.mjs --no-skip "images manifests and home" --page "$PAGES/images.html"
      - run: node ui/check.mjs --no-skip "images active gesture pixels" --page "$PAGES/images.html"
      - run: node ui/check.mjs --no-skip "images missing added-sheet" --page "$PAGES/images.html"
      - run: node ui/check.mjs --no-skip "images missing removed-sheet" --page "$PAGES/images.html"
      - run: node ui/check.mjs --no-skip "images missing added-board" --page "$PAGES/images.html"
      - run: node ui/check.mjs --no-skip "images missing removed-board" --page "$PAGES/images.html"
      - run: node ui/check.mjs --no-skip "images inspect search and anchors" --page "$PAGES/images.html"
      - run: node ui/check.mjs --persist-check --image-fallback --no-skip "Themes reload seed" --page "$PAGES/images.html"
      - run: node ui/check.mjs --persist-check --no-skip "Themes reload seed" --page "$PAGES/images.html"
      - run: node ui/check.mjs --no-skip "images screen and legacy appearance" --width 1440 --height 900 --dpr 2 --page "$PAGES/images.html"
      - run: node ui/check.mjs --no-skip "images screen and legacy appearance" --dark --width 1440 --height 900 --dpr 2 --page "$PAGES/images.html"
