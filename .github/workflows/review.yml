name: KiCad review
on:
  workflow_call:

env:
  # Official KiCad image, pinned by digest so a new upload under the same tag cannot change results.
  KICAD_IMAGE: kicad/kicad:10.0.6-full@sha256:e36e29b5f4a638a1a7238eba3d2fcbc8e061ffed1e99a8f39cb722706c94a58e

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: kicad-review-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Skip push that an open pull request already covers
        id: gate
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh pr list -R "$GITHUB_REPOSITORY" --head "$GITHUB_REF_NAME" --state open --json number -q length)
          if [ "$n" != 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Branch has an open pull request; the pull request run reviews it." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check out project history
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: repo

      - name: Check out review tools
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: tools

      - name: Find changed KiCad projects
        id: detect
        if: steps.gate.outputs.skip != 'true'
        working-directory: repo
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          IN_BASE: ${{ github.event.inputs.base }}
          IN_HEAD: ${{ github.event.inputs.head }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 ../tools/kicad_review.py detect --out ../review/detect.json

      - name: Check out both revisions side by side
        if: steps.detect.outputs.changed == 'true'
        working-directory: repo
        run: |
          git worktree add --detach ../head "${{ steps.detect.outputs.head }}"
          if [ -n "${{ steps.detect.outputs.base }}" ]; then
            git worktree add --detach ../base "${{ steps.detect.outputs.base }}"
          fi
          git worktree list

      - name: Render both revisions
        if: steps.detect.outputs.changed == 'true'
        run: |
          time docker pull -q "$KICAD_IMAGE"
          docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/w" -w /w "$KICAD_IMAGE" \
            sh -c 'python3 --version && time python3 tools/kicad_review.py render'

      - name: Upload review
        if: steps.detect.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kicad-review
          path: review/
          retention-days: 14
