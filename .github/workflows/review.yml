name: KiCad review
on:
  workflow_call:

env:
  # Official KiCad image, pinned by digest so a new upload under the same tag cannot change results.
  KICAD_IMAGE: kicad/kicad:10.0.6-full@sha256:e36e29b5f4a638a1a7238eba3d2fcbc8e061ffed1e99a8f39cb722706c94a58e

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Only pull request runs share a group, so a newer PR run replaces the older one; every push, tag and manual run has its own group, because each push reviews only its own commits.
    concurrency:
      group: kicad-review-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    steps:
      - name: Skip push that an open pull request already covers
        id: gate
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh pr list -R "$GITHUB_REPOSITORY" --head "$GITHUB_REF_NAME" --state open --json number -q length)
          if [ "$n" != 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Branch has an open pull request; the pull request run reviews it." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check out project history
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Fetch all branch tips into origin/*, including the live waiver target on reruns.
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: repo
          persist-credentials: false

      - name: Check out review tools
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: tools
          persist-credentials: false

      - name: Find changed KiCad projects
        id: detect
        if: steps.gate.outputs.skip != 'true' && !startsWith(github.ref, 'refs/tags/')
        working-directory: repo
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          IN_BASE: ${{ github.event.inputs.base }}
          IN_HEAD: ${{ github.event.inputs.head }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 ../tools/kicad_review.py detect

      - name: Check out both revisions side by side
        if: steps.detect.outputs.changed == 'true'
        working-directory: repo
        run: |
          git worktree add --detach ../head "${{ steps.detect.outputs.head }}"
          if [ -n "${{ steps.detect.outputs.base }}" ]; then
            git worktree add --detach ../base "${{ steps.detect.outputs.base }}"
          fi

      - name: Render both revisions and run ERC/DRC
        if: steps.detect.outputs.changed == 'true'
        run: |
          docker run -q --rm -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/w" -w /w "$KICAD_IMAGE" \
            python3 tools/kicad_review.py render

      - name: Compress 3D board models
        if: steps.detect.outputs.changed == 'true'
        continue-on-error: true
        shell: bash
        run: |
          shopt -s nullglob
          models=(review/*/{base,head}/board.glb)
          [ ${#models[@]} -gt 0 ] || exit 0
          deps=$(mktemp -d)
          trap 'rm -rf "$deps"' EXIT
          if ! npm install --prefix "$deps" --no-save --package-lock=false @gltf-transform/core@4.2.1 @gltf-transform/extensions@4.2.1 @gltf-transform/functions@4.2.1 meshoptimizer@0.22.0; then
            echo "::warning::Meshopt dependencies unavailable; keeping original GLBs."
            exit 0
          fi
          for model in "${models[@]}"; do
            # Write beside the original, replacing it only after a successful export.
            tmp=$(mktemp -d "${model%/*}/meshopt.XXXXXX") || continue
            start=$SECONDS
            before=$(wc -c < "$model")
            if NODE_PATH="$deps/node_modules" node tools/ui/compress3d.cjs "$model" "$tmp/board.glb" && [ -s "$tmp/board.glb" ]; then
              if mv "$tmp/board.glb" "$model"; then
                echo "Meshopt $model: $before -> $(wc -c < "$model") bytes in $((SECONDS - start))s"
              fi
            else
              echo "::warning::Meshopt failed for $model; keeping the original GLB."
            fi
            rm -rf "$tmp"
          done

      - name: Build comparison report and checks
        id: report
        if: steps.detect.outputs.changed == 'true'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # Read the live PR target tip; non-PR runs use the default branch, not the pushed branch.
          WAIVERS_REF: origin/${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
        run: python3 tools/kicad_review.py report

      # Threads live on the pull request as review comments; the summary only counts them.
      - name: Collect review threads
        if: steps.report.outputs.threads == 'true' && github.event.pull_request.number
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # ponytail: first 100 threads only; gate fails closed above that ceiling; paginate if needed.
          gh api graphql -f owner="${GITHUB_REPOSITORY%/*}" -f name="${GITHUB_REPOSITORY#*/}" -F number="$PR" \
            -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewThreads(first:100){totalCount nodes{isResolved comments(first:1){nodes{body}}}}}}}' \
            > review/threads.json || { rm -f review/threads.json; echo "::warning::Could not read review threads"; }

      - name: Copy named report
        if: steps.detect.outputs.changed == 'true'
        env:
          REPORT_NAME: ${{ steps.report.outputs.name }}
        run: cp review/kicad-review.html "review/$REPORT_NAME"

      - name: Upload report
        id: upload
        if: steps.detect.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          archive: false
          path: review/${{ steps.report.outputs.name }}
          retention-days: 90

      - name: Screenshots of changed drawings
        if: steps.detect.outputs.changed == 'true'
        continue-on-error: true
        run: python3 tools/kicad_review.py shots

      - name: Build PDF report
        if: steps.report.outputs.pdf == 'true'
        continue-on-error: true
        env:
          PDF_NAME: ${{ steps.report.outputs.pdf_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: python3 tools/kicad_review.py pdf

      - name: Upload PDF report
        if: steps.report.outputs.pdf == 'true' && hashFiles(format('review/{0}', steps.report.outputs.pdf_name)) != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          archive: false
          path: review/${{ steps.report.outputs.pdf_name }}
          retention-days: 90

      # Private repositories cannot show artifact images in a comment, so the screenshots go to a separate
      # kicad-review-assets branch (one commit, rewritten each run) and are linked from github.com/<repo>/raw/...,
      # which repository members' browsers can load. Project branches are never written to.
      - name: Publish screenshots
        id: images
        if: steps.detect.outputs.changed == 'true'
        continue-on-error: true
        env:
          TOKEN: ${{ github.token }}
          KEY: ${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && format('branch-{0}', github.ref_name) || format('run-{0}', github.run_id) }}
        run: |
          ls review/images/*.png >/dev/null 2>&1 || exit 0
          KEY=${KEY//\//-}  # one folder level per key: the clean-up below reads each top-level folder's .stamp
          branch=kicad-review-assets
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          mkdir -p "$RUNNER_TEMP/assets" && cd "$RUNNER_TEMP/assets"
          git init -q && git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          for attempt in 1 2 3; do
            git read-tree --empty && rm -rf ./*
            lease=""
            if git -c http.extraheader="$auth" fetch -q --depth 1 origin "$branch"; then
              lease=$(git rev-parse FETCH_HEAD); git checkout -q FETCH_HEAD -- .
            fi
            now=$(date +%s)
            for d in */; do  # drop folders untouched for 30 days
              if [ -d "$d" ] && [ $((now - $(cat "$d.stamp" 2>/dev/null || echo 0))) -gt 2592000 ]; then rm -rf "$d"; fi
            done
            rm -rf "$KEY" && mkdir -p "$KEY/$GITHUB_RUN_ID" && cp "$GITHUB_WORKSPACE"/review/images/*.png "$KEY/$GITHUB_RUN_ID/"
            echo "$now" > "$KEY/.stamp"
            git add -A
            tree=$(git write-tree)
            commit=$(git -c user.name=kicad-review -c user.email=kicad-review@users.noreply.github.com commit-tree "$tree" -m "KiCad review screenshots")
            if git -c http.extraheader="$auth" push -q --force-with-lease="$branch:$lease" origin "$commit:refs/heads/$branch"; then
              echo "base=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/raw/$branch/$KEY/$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1

      # The opt-in review log lives in the bot's existing PR comment.
      - name: Fetch previous review log
        if: ${{ !cancelled() && github.event.pull_request.number && github.event.pull_request.head.repo.full_name == github.repository && vars.KICAD_REVIEW_HISTORY == 'true' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p review
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments?per_page=100" --paginate \
            -q '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- kicad-review -->"))) | .body' \
            | python3 -c 'import sys; t = sys.stdin.read(); s, e = "<!-- kicad-review-log -->", "<!-- /kicad-review-log -->"; print(t[t.index(s):t.index(e) + len(e)] if s in t and e in t and t.index(s) < t.index(e) else "", end="")' \
            > review/previous-log.md
          [ -s review/previous-log.md ] || rm -f review/previous-log.md

      - name: Job summary
        id: summary
        if: steps.detect.outputs.changed == 'true'
        env:
          IMAGES: ${{ steps.images.outputs.base }}
          ARTIFACT: ${{ steps.upload.outputs.artifact-url }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          SITE: ${{ vars.KICAD_REVIEW_SITE }}
          HISTORY: ${{ vars.KICAD_REVIEW_HISTORY }}
        run: python3 tools/kicad_review.py summary --image-base "$IMAGES" --artifact-url "$ARTIFACT" --artifact-id "$ARTIFACT_ID" > /dev/null

      # Optional: one check run per check, so branch protection can require ERC, DRC... separately.
      # The caller must grant checks: write; without it GitHub answers 403 and this step only warns.
      - name: Publish check runs
        if: ${{ !cancelled() && steps.summary.outputs.check_runs == 'true' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ steps.detect.outputs.head }}
        run: |
          [ -f review/check-runs.json ] || { echo "::warning::review/check-runs.json missing; no check runs published."; exit 0; }
          jq -c '.[]' review/check-runs.json | while read -r run; do
            printf '%s\n' "$run" | jq --arg sha "$HEAD" '. + {head_sha: $sha, status: "completed"}' \
              | gh api "repos/$GITHUB_REPOSITORY/check-runs" --input - > /dev/null \
              || { echo "::warning::Could not publish check runs. Add 'checks: write' to the permissions of .github/workflows/kicad-review.yml."; exit 0; }
          done

      - name: Pull request comment
        id: comment
        if: ${{ !cancelled() && github.event.pull_request.number && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SUMMARY: ${{ steps.summary.outcome }}
          CHANGED: ${{ steps.detect.outputs.changed }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p review
          if [ "$CHANGED" = false ]; then
            printf '<!-- kicad-review -->\n### No KiCad changes in this commit\n' > review/comment.md
            if [ -f review/previous-log.md ]; then printf '\n' >> review/comment.md; cat review/previous-log.md >> review/comment.md; fi
          elif [ "$SUMMARY" != success ]; then
            # The failure body prevents earlier results from looking current.
            printf '<!-- kicad-review -->\n### KiCad review failed — see [run](%s)\n\nNo review for `%s`. Results from earlier commits were removed so they are not mistaken for this one.\n' "$RUN_URL" "${SHA:0:7}" > review/comment.md
            if [ -f review/previous-log.md ]; then printf '\n' >> review/comment.md; cat review/previous-log.md >> review/comment.md; fi
          fi
          [ -n "$PR" ] || exit 0
          # One comment per pull request, edited in place on every run.
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            -q '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- kicad-review -->"))) | .id' | head -1)
          [ -n "$id" ] || [ "$CHANGED" != false ] || exit 0
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@review/comment.md --jq .html_url
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@review/comment.md --jq .html_url
          fi

      - name: Fail on required checks
        if: steps.report.outputs.failed != '' || steps.summary.outputs.threads_failed != ''
        env:
          FAILED: ${{ steps.report.outputs.failed }}
          THREADS: ${{ steps.summary.outputs.threads_failed }}
        run: |
          [ -z "$FAILED" ] || echo "::error::Required checks failed: $FAILED"
          [ -z "$THREADS" ] || echo "::error::Merge blocked: $THREADS"
          exit 1

      - name: Fabrication outputs for the version tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          docker run -q --rm -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/w" -w /w "$KICAD_IMAGE" \
            python3 tools/kicad_review.py release --tag "$GITHUB_REF_NAME"

      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --clobber release/*
