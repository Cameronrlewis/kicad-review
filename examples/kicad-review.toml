# Optional. Put at the repository root as kicad-review.toml. Every key is optional; these are the defaults.

# "new": a required check fails only on errors this change introduced. "all": any error fails it.
fail_on = "new"

[checks]
# required: a failure fails the workflow run. informational: reported only. off: not run.
erc = "required"
drc = "required"
parity = "required"      # schematic and board agree (DRC --schematic-parity)
bom = "informational"    # every part has the fields below
interfaces = "off"     # netlist design-review rules (UART, I2C, CAN, USB-C CC, connector ESD, voltage domains)
release = "off"        # fabrication package completeness; costs ~2-4 s per board

[bom]
required_fields = ["Value", "Footprint"]
# critical_prefixes = ["U", "J", "Q", "D", "Y", "X", "K", "F"]   # datasheet coverage shown separately (Parts)
# order_ready_fields = []   # empty: the fabrication preset's fields (Parts)

[fabrication]
preset = "jlcpcb"        # or "pcbway"
# part_field = "LCSC"    # symbol field holding the supplier part number; default LCSC (jlcpcb) or MPN (pcbway)

[3d]
enabled = false            # export changed boards as GLB and report footprints without 3D models

# Parts: datasheet links, LCSC/MPN and part-number problems per component in the Parts tab and PR comment.
[parts]
enabled = false

# Tag-to-tag review and a marked section in GitHub release notes; fabrication remains independent.
[release]
review = false
# [interfaces]           # extra net or pin-function names per rule
# i2c_sda = ["SDA", "TOUCH_SDA"]
[threads]
# Pin discussion threads to parts and points in the review site. Threads are pull-request review comments.
# Needs the review site and its GitHub App's Pull requests permission. Off by default.
enabled = false
block_merge = false  # fail the review while a blocking thread is open; needs enabled = true

[github]
# One GitHub check run per check, for branch protection. Needs "checks: write" in the caller workflow. Off by default.
check_runs = false

[waivers]
# Read kicad-review-waivers.toml and let waived findings pass required checks. Off by default.
enabled = false

[inventory]
# "All parts" list in the report. Adds about 100 bytes per part to the report.
enabled = false

# Optional printable review; requires Chrome in the workflow.
[pdf]
enabled = false

[libraries]
enabled = false
